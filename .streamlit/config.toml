[server]
enableStaticServing = true
# true: never ask questions or open a browser (needed online). start.bat switches it off on your
# own computer, so the browser still opens there.
headless = true

[browser]
gatherUsageStats = false

[client]
# "minimal": visitors don't see the developer buttons (like Deploy) at the top right
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#c0392b"
backgroundColor = "#f7f4ee"
secondaryBackgroundColor = "#ece7dd"
textColor = "#2b3345"
